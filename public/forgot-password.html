<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>HarvestLink — Forgot Password</title>
<style>
  :root { --brand:#1e6b3c; --brand-dark:#185b32; --border:#e0e0e0; --bg:#fafaf8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; background:var(--bg); display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .card { background:#fff; border:1px solid var(--border); border-radius:10px; padding:2rem; width:100%; max-width:380px; }
  h1 { font-size:18px; margin-bottom:6px; }
  p.sub { font-size:13px; color:#888; margin-bottom:18px; }
  label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:6px; font-size:14px; margin-bottom:14px; }
  button { width:100%; padding:12px; background:var(--brand); color:#fff; border:none; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer; }
  button:hover { background:var(--brand-dark); }
  .msg { display:none; margin-top:14px; padding:10px 12px; border-radius:6px; font-size:13px; }
  .msg.show { display:block; }
  .msg.ok { background:#eaf5ee; color:var(--brand); }
  .msg.err { background:#fdecea; color:#a33333; }
  .link-box { margin-top:10px; padding:10px; background:#f4f4f2; border-radius:6px; font-size:12.5px; word-break:break-all; }
  a { color:var(--brand); font-size:13px; text-decoration:none; }
</style>
</head>
<body>
<div class="card">
  <h1>Forgot your password?</h1>
  <p class="sub">Enter the email on your account and we'll generate a reset link.</p>
  <form id="form">
    <label for="email">Email</label>
    <input type="email" id="email" required placeholder="you@example.com" />
    <button type="submit">Send reset link</button>
  </form>
  <div class="msg" id="msg"></div>
  <div style="margin-top:16px;"><a href="login.html">← Back to sign in</a></div>
</div>
<script>
  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("msg");
    const email = document.getElementById("email").value.trim();
    try {
      const res = await fetch("/api/auth/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();
      if (!res.ok) {
        msg.textContent = data.error || "Something went wrong.";
        msg.className = "msg show err";
        return;
      }
      if (data.reset_link) {
        msg.textContent = "Redirecting you to reset your password...";
        msg.className = "msg show ok";
        setTimeout(() => (window.location.href = data.reset_link), 900);
      } else {
        msg.textContent = data.message;
        msg.className = "msg show ok";
      }
    } catch (err) {
      msg.textContent = "Could not reach the server.";
      msg.className = "msg show err";
    }
  });
</script>
</body>
</html>
