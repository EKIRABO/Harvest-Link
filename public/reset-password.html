<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>HarvestLink — Reset Password</title>
<style>
  :root { --brand:#1e6b3c; --brand-dark:#185b32; --border:#e0e0e0; --bg:#fafaf8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; background:var(--bg); display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .card { background:#fff; border:1px solid var(--border); border-radius:10px; padding:2rem; width:100%; max-width:380px; }
  h1 { font-size:18px; margin-bottom:18px; }
  label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:6px; font-size:14px; margin-bottom:14px; }
  button { width:100%; padding:12px; background:var(--brand); color:#fff; border:none; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer; }
  button:hover { background:var(--brand-dark); }
  .msg { display:none; margin-top:14px; padding:10px 12px; border-radius:6px; font-size:13px; }
  .msg.show { display:block; }
  .msg.ok { background:#eaf5ee; color:var(--brand); }
  .msg.err { background:#fdecea; color:#a33333; }
</style>
</head>
<body>
<div class="card">
  <h1>Reset your password</h1>
  <form id="form">
    <label for="new_password">New password</label>
    <input type="password" id="new_password" required minlength="6" />
    <label for="confirm_password">Confirm new password</label>
    <input type="password" id="confirm_password" required minlength="6" />
    <button type="submit">Reset password</button>
  </form>
  <div class="msg" id="msg"></div>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");

  if (!token) {
    document.getElementById("msg").textContent = "No reset token found in the link.";
    document.getElementById("msg").className = "msg show err";
    document.getElementById("form").style.display = "none";
  }

  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("msg");
    const new_password = document.getElementById("new_password").value;
    const confirm_password = document.getElementById("confirm_password").value;

    if (new_password !== confirm_password) {
      msg.textContent = "Passwords don't match.";
      msg.className = "msg show err";
      return;
    }

    try {
      const res = await fetch("/api/auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, new_password }),
      });
      const data = await res.json();
      if (!res.ok) {
        msg.textContent = data.error || "Could not reset password.";
        msg.className = "msg show err";
        return;
      }
      msg.textContent = data.message + " Redirecting to sign in...";
      msg.className = "msg show ok";
      setTimeout(() => (window.location.href = "login.html"), 1800);
    } catch (err) {
      msg.textContent = "Could not reach the server.";
      msg.className = "msg show err";
    }
  });
</script>
</body>
</html>
