<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HarvestLink — Notifications</title>
<style>
  :root {

    --sidebar-bg: #16351f; --sidebar-bg-2: #0f2417; --sidebar-active: #2f8a4c;
    --sidebar-text: #cfe0d3; --brand: #2f8a4c; --bg: #f4f6f4; --card-bg: #ffffff;
    --border: #eaeceb; --text: #1c211d; --text-muted: #7c847e; --radius: 14px;
  }
  :root.theme-admin {

    --sidebar-bg: #0f1a3d; --sidebar-bg-2: #0a1329; --sidebar-active: #3b6fd6;
    --sidebar-text: #c3cbe0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  a { text-decoration: none; color: inherit; }
  button { font-family: inherit; }
  .layout { display: flex; min-height: 100vh; }


  .sidebar { width: 240px; flex-shrink: 0; background: linear-gradient(180deg, var(--sidebar-bg), var(--sidebar-bg-2)); color: var(--sidebar-text); display: flex; flex-direction: column; padding: 1.25rem 0.9rem; }
  .brand-row { display: flex; align-items: center; gap: 9px; padding: 0 6px 20px; }
  .brand-icon { width: 30px; height: 30px; border-radius: 8px; background: var(--sidebar-active); display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .brand-row .name { font-weight: 700; font-size: 15.5px; color: #fff; }

  .id-chip { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 10px; margin-bottom: 18px; }
  .id-avatar { width: 34px; height: 34px; border-radius: 8px; background: linear-gradient(135deg, #6fbf73, #3a8f4e); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #fff; flex-shrink: 0; }
  :root.theme-admin .id-avatar { background: linear-gradient(135deg, #6f9be0, #3b6fd6); }
  .id-chip .id-name { font-size: 13px; font-weight: 700; color: #fff; }
  .id-chip .id-badge { font-size: 10.5px; color: #8fd39a; }
  :root.theme-admin .id-chip .id-badge { color: #9db3e0; }

  nav.side-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
  .nav-link { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; font-size: 13.5px; color: var(--sidebar-text); cursor: pointer; position: relative; }
  .nav-link .ic { width: 17px; text-align: center; font-size: 14px; opacity: 0.85; }
  .nav-link:hover { background: rgba(255,255,255,0.05); }
  .nav-link.active { background: var(--sidebar-active); color: #fff; font-weight: 600; }
  .nav-link.active .ic { opacity: 1; }
  .nav-link.disabled { opacity: 0.45; cursor: default; }
  .nav-link.disabled:hover { background: none; }
  .nav-link .soon-tag { margin-left: auto; font-size: 9px; text-transform: uppercase; letter-spacing: 0.03em; background: rgba(255,255,255,0.08); padding: 2px 5px; border-radius: 4px; }
  .nav-link .badge { margin-left: auto; background: #e05353; color: #fff; font-size: 10px; font-weight: 700; border-radius: 999px; min-width: 17px; height: 17px; display: flex; align-items: center; justify-content: center; padding: 0 4px; }
  .nav-divider { height: 1px; background: rgba(255,255,255,0.07); margin: 10px 4px; }

  main { flex: 1; padding: 1.6rem 2rem; max-width: 900px; }
  .top-row h1 { font-size: 21px; font-weight: 700; margin-bottom: 3px; }
  .top-row .sub { font-size: 13px; color: var(--text-muted); margin-bottom: 1.4rem; }

  .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 18px; }
  .notif-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
  .notif-item:last-child { border-bottom: none; }
  .notif-ic { width: 32px; height: 32px; border-radius: 50%; background: #e8effc; color: #3b6fd6; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  .notif-text { font-size: 13.5px; line-height: 1.4; color: var(--text); }
  .notif-time { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }
  .notif-item.unread { background: #f6faf7; margin: 0 -12px; padding: 12px; border-radius: 8px; }
  .panel-empty { color: var(--text-muted); font-size: 13px; text-align: center; padding: 30px 10px; }
  .error-state { color: #d65b5b; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1c211d; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; z-index: 100; display: none; max-width: 360px; text-align: center; }
  .toast.show { display: block; }
</style>
</head>
<body>
<div class="layout">


  <aside class="sidebar" id="sidebarRoot"></aside>

  <main>
    <div class="top-row">
      <h1>Your Notifications</h1>
      <div class="sub">Here is a complete history of all your alerts and updates.</div>
    </div>

    <div class="panel">
      <div id="notifications-list">
        <p class="panel-empty">Loading notifications...</p>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="js/notifications-admin.js"></script>
</body>
</html>
